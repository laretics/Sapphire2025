<!DOCTYPE html>
<html lang="es-es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sapphire2025</title>
    <base href="/" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="_content/Blazor.Bootstrap/blazor.bootstrap.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Sapphire2025.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />

</head>

<body>
    <div id="app">
        <div class="app-loading">
            <!-- Solo se activa en pantallas grandes (ver script inferior). muted + playsinline permiten autoplay. -->
            <video id="app-loading-video"
                   class="app-loading-video"
                   muted
                   autoplay
                   loop
                   playsinline
                   preload="none"
                   aria-hidden="true"></video>
            <div class="app-loading-ui">
                <svg class="loading-progress">
                    <circle r="40%" cx="50%" cy="50%" />
                    <circle r="40%" cx="50%" cy="50%" />
                </svg>
                <div class="loading-progress-text">Cargando Zafiro...</div>
            </div>
        </div>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Vídeo de carga solo en pantallas grandes: no se descarga en móvil/tablet.
        (function () {
            var minWidth = 992; // Bootstrap lg
            var video = document.getElementById('app-loading-video');
            if (!video) return;
            if (window.matchMedia('(min-width: ' + minWidth + 'px)').matches) {
                video.src = 'Video/Sapphire2026.mp4';
                video.muted = true;
                video.play().catch(function () { /* autoplay bloqueado: se queda el spinner */ });
            } else {
                video.remove();
            }
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--Script de importación de Excel para Jefes de Maquinistas (y lo que se tercie)-->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/Sapphire2025.js"></script>
    <script src="js/ExcelInterop.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="_content/BlazorMonaco/jsInterop.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>
    <script src="_content/Blazor.Bootstrap/blazor.bootstrap.js"></script>

</body>

</html>
